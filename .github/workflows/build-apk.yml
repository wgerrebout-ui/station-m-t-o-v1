Pour une première mise en route depuis un téléphone Android, crée d'abord ce fichier dans le dépôt GitHub :
.github/workflows/build-apk.yml

Copie-colle le contenu suivant, puis valide le commit :

name: Construire l'APK Android
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le projet envoyé en ZIP
        run: |
          if [ -f station_meteo_apk.zip ]; then
            unzip -q station_meteo_apk.zip -d /tmp/station-source
            cp -a /tmp/station-source/station_meteo_apk/. .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: station-meteo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
